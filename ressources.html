<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Ressources techniques du génie civil. Documentation, guides, schémas et projets.">
  <meta name="theme-color" content="#1E40AF">
  <title>Ressources — GÉNIE CIVIL UNIS — BÉNIN</title>
  
  <link rel="icon" type="image/png" href="assets/images/logo.png">
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="ressources">
  <div id="site-header"></div>
  
  <main id="main">
    <!-- Hero -->
    <section class="hero-sub" style="background: linear-gradient(rgba(30, 64, 175, 0.9), rgba(30, 64, 175, 0.8)), url('../assets/images/bg-hero.jpg'); background-size: cover; background-position: center; color: white; padding: 6rem 0;">
      <div class="container" style="text-align: center;">
        <h1 data-animate>Ressources Techniques</h1>
        <p class="hero-slogan" data-animate data-delay="1" style="font-style: italic; opacity: 0.9; max-width: 700px; margin-inline: auto;">
          Partageons des connaissances et des savoir-faire pour faire progresser le génie civil.
        </p>
      </div>
    </section>

    <!-- Catégories -->
    <section class="section">
      <div class="container">
        <div data-animate style="text-align: center; margin-bottom: 3rem;">
          <h2>Catégories de ressources</h2>
          <p style="color: var(--gray-600); max-width: 700px; margin-inline: auto;">
            Des documents organisés par thème pour faciliter votre apprentissage.
          </p>
        </div>
        
        <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem;" data-animate>
          <a href="#batiment" class="card" style="background: white; border-radius: var(--border-radius-xl); padding: 1.5rem; box-shadow: var(--shadow-lg); display: block;">
            <div style="width: 56px; height: 56px; background: rgba(30, 64, 175, 0.1); border-radius: var(--border-radius-md); display: flex; align-items: center; justify-content: center; margin-bottom: 1rem; margin-inline: auto;">
              <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </div>
            <h3 style="text-align: center;">Bâtiment</h3>
          </a>
          
          <a href="#routes" class="card" style="background: white; border-radius: var(--border-radius-xl); padding: 1.5rem; box-shadow: var(--shadow-lg); display: block;">
            <div style="width: 56px; height: 56px; background: rgba(30, 64, 175, 0.1); border-radius: var(--border-radius-md); display: flex; align-items: center; justify-content: center; margin-bottom: 1rem; margin-inline: auto;">
              <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2"><path d="M12 19V5M5 12l7 7 7-7"></path></svg>
            </div>
            <h3 style="text-align: center;">Routes & TP</h3>
          </a>
          
          <a href="#dessin" class="card" style="background: white; border-radius: var(--border-radius-xl); padding: 1.5rem; box-shadow: var(--shadow-lg); display: block;">
            <div style="width: 56px; height: 56px; background: rgba(30, 64, 175, 0.1); border-radius: var(--border-radius-md); display: flex; align-items: center; justify-content: center; margin-bottom: 1rem; margin-inline: auto;">
              <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2"><path d="M2 12V4a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v8"></path><path d="M2 12l9 9 13-13"></path></svg>
            </div>
            <h3 style="text-align: center;">Dessin technique</h3>
          </a>
          
          <a href="#materiaux" class="card" style="background: white; border-radius: var(--border-radius-xl); padding: 1.5rem; box-shadow: var(--shadow-lg); display: block;">
            <div style="width: 56px; height: 56px; background: rgba(30, 64, 175, 0.1); border-radius: var(--border-radius-md); display: flex; align-items: center; justify-content: center; margin-bottom: 1rem; margin-inline: auto;">
              <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4l3 2"></path></svg>
            </div>
            <h3 style="text-align: center;">Matériaux</h3>
          </a>
          
          <a href="#topographie" class="card" style="background: white; border-radius: var(--border-radius-xl); padding: 1.5rem; box-shadow: var(--shadow-lg); display: block;">
            <div style="width: 56px; height: 56px; background: rgba(30, 64, 175, 0.1); border-radius: var(--border-radius-md); display: flex; align-items: center; justify-content: center; margin-bottom: 1rem; margin-inline: auto;">
              <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2"><path d="M2 12V4a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v8"></path><path d="M2 12l9 9 13-13"></path></svg>
            </div>
            <h3 style="text-align: center;">Topographie</h3>
          </a>
          
          <a href="#logiciels" class="card" style="background: white; border-radius: var(--border-radius-xl); padding: 1.5rem; box-shadow: var(--shadow-lg); display: block;">
            <div style="width: 56px; height: 56px; background: rgba(30, 64, 175, 0.1); border-radius: var(--border-radius-md); display: flex; align-items: center; justify-content: center; margin-bottom: 1rem; margin-inline: auto;">
              <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"></rect></svg>
            </div>
            <h3 style="text-align: center;">Logiciels</h3>
          </a>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  
  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
