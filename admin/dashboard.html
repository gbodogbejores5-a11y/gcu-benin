<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Tableau de bord d'administration de GCU-BÉNIN.">
  <meta name="theme-color" content="#1E40AF">
  <title>Tableau de bord — GCU-BÉNIN Admin</title>
  
  <link rel="icon" type="image/png" href="../assets/images/logo.png">
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body { background: var(--gray-50); }
  </style>
</head>
<body data-page="admin-dashboard">
  <div id="admin-header"></div>
  
  <main id="main" style="padding: 2rem;">
    <div class="container" style="padding: 0;">
      <div data-animate style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
        <h1>Tableau de bord</h1>
        <div style="display: flex; align-items: center; gap: 1rem;">
          <span style="color: var(--gray-600);">Administrateur</span>
          <button class="btn btn-secondary" style="font-size: 0.875rem;">Déconnexion</button>
        </div>
      </div>
      
      <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.5rem;" data-animate>
        <div class="card" style="background: white; border-radius: var(--border-radius-xl); padding: 1.5rem; box-shadow: var(--shadow-lg);">
          <div style="display: flex; align-items: center; gap: 1rem;">
            <div style="width: 56px; height: 56px; background: rgba(30, 64, 175, 0.1); border-radius: var(--border-radius-md); display: flex; align-items: center; justify-content: center;">
              <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2"><path d="M17 21v-8a2 2 0 0 0-2-2H9a2 2 0 0 0-2 2v8"></path><path d="M21 21H3"></path><circle cx="7" cy="7" r="1"></circle><circle cx="17" cy="7" r="1"></circle></svg>
            </div>
            <div>
              <h3 style="font-size: 1.75rem; color: var(--primary);">0</h3>
              <p style="color: var(--gray-600); font-size: 0.875rem;">Membres inscrits</p>
            </div>
          </div>
        </div>
        
        <div class="card" style="background: white; border-radius: var(--border-radius-xl); padding: 1.5rem; box-shadow: var(--shadow-lg);">
          <div style="display: flex; align-items: center; gap: 1rem;">
            <div style="width: 56px; height: 56px; background: rgba(245,158,11,0.1); border-radius: var(--border-radius-md); display: flex; align-items: center; justify-content: center;">
              <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l4-4a1 1 0 0 0-1.4-1.4l-3.6 3.6-3.6-3.6.7-.7a1 1 0 0 0 0-1.4 1 1 0 0 1 1.4-1.4l-1.4 1.4z"></path></svg>
            </div>
            <div>
              <h3 style="font-size: 1.75rem; color: var(--accent);">0</h3>
              <p style="color: var(--gray-600); font-size: 0.875rem;">Demandes d'adhésion</p>
            </div>
          </div>
        </div>
        
        <div class="card" style="background: white; border-radius: var(--border-radius-xl); padding: 1.5rem; box-shadow: var(--shadow-lg);">
          <div style="display: flex; align-items: center; gap: 1rem;">
            <div style="width: 56px; height: 56px; background: rgba(16,185,129,0.1); border-radius: var(--border-radius-md); display: flex; align-items: center; justify-content: center;">
              <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#10B981" stroke-width="2"><path d="M2 12V4a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v8"></path><path d="M2 12l9 9 13-13"></path></svg>
            </div>
            <div>
              <h3 style="font-size: 1.75rem; color: #10B981;">0</h3>
              <p style="color: var(--gray-600); font-size: 0.875rem;">Actualités</p>
            </div>
          </div>
        </div>
        
        <div class="card" style="background: white; border-radius: var(--border-radius-xl); padding: 1.5rem; box-shadow: var(--shadow-lg);">
          <div style="display: flex; align-items: center; gap: 1rem;">
            <div style="width: 56px; height: 56px; background: rgba(239,68,68,0.1); border-radius: var(--border-radius-md); display: flex; align-items: center; justify-content: center;">
              <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--error)" stroke-width="2"><path d="M17 21v-8a2 2 0 0 0-2-2H9a2 2 0 0 0-2 2v8"></path><path d="M21 21H3"></path><circle cx="7" cy="7" r="1"></circle><circle cx="17" cy="7" r="1"></circle></svg>
            </div>
            <div>
              <h3 style="font-size: 1.75rem; color: var(--error);">0</h3>
              <p style="color: var(--gray-600); font-size: 0.875rem;">Messages non lus</p>
            </div>
          </div>
        </div>
      </div>
      
      <!-- Menu d'administration -->
      <div data-animate data-delay="1" style="margin-top: 2rem;">
        <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem;">
          <a href="#" class="card" style="background: white; border-radius: var(--border-radius-xl); padding: 1.25rem; box-shadow: var(--shadow-lg); text-align: center; display: block;">
            <h3 style="color: var(--primary); margin-bottom: 0.5rem; font-size: 1rem;">Membres</h3>
            <p style="color: var(--gray-600); font-size: 0.85rem;">Gérer les adhésions et profils</p>
          </a>
          <a href="#" class="card" style="background: white; border-radius: var(--border-radius-xl); padding: 1.25rem; box-shadow: var(--shadow-lg); text-align: center; display: block;">
            <h3 style="color: var(--primary); margin-bottom: 0.5rem; font-size: 1rem;">Actualités</h3>
            <p style="color: var(--gray-600); font-size: 0.85rem;">Publier et gérer les actualités</p>
          </a>
          <a href="#" class="card" style="background: white; border-radius: var(--border-radius-xl); padding: 1.25rem; box-shadow: var(--shadow-lg); text-align: center; display: block;">
            <h3 style="color: var(--primary); margin-bottom: 0.5rem; font-size: 1rem;">Événements</h3>
            <p style="color: var(--gray-600); font-size: 0.85rem;">Organiser et gérer les événements</p>
          </a>
          <a href="#" class="card" style="background: white; border-radius: var(--border-radius-xl); padding: 1.25rem; box-shadow: var(--shadow-lg); text-align: center; display: block;">
            <h3 style="color: var(--primary); margin-bottom: 0.5rem; font-size: 1rem;">Ressources</h3>
            <p style="color: var(--gray-600); font-size: 0.85rem;">Uploader et gérer les documents</p>
          </a>
        </div>
      </div>
    </div>
  </main>

  <script src="../js/config.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
