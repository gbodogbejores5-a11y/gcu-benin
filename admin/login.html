<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Espace d'administration de GCU-BÉNIN.">
  <meta name="theme-color" content="#1E40AF">
  <title>Administration — GÉNIE CIVIL UNIS — BÉNIN</title>
  
  <link rel="icon" type="image/png" href="../assets/images/logo.png">
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); min-height: 100vh; display: flex; align-items: center; }
    .login-card { background: white; border-radius: var(--border-radius-xl); box-shadow: var(--shadow-xl); max-width: 400px; margin: 0 auto; }
  </style>
</head>
<body>
  <main style="padding: 2rem;">
    <div class="login-card" data-animate>
      <div style="text-align: center; padding: 2rem 2rem 1rem;">
        <div style="width: 80px; height: 80px; background: rgba(30, 64, 175, 0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem;">
          <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2"><path d="M12 5L22 12L12 19L2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        </div>
        <h1 style="font-size: 1.5rem; color: var(--primary); margin-bottom: 0.25rem;">Administration</h1>
        <p style="color: var(--gray-600); font-size: 0.9rem;">GÉNIE CIVIL UNIS — BÉNIN</p>
      </div>
      
      <div style="padding: 0 2rem 2rem;">
        <form id="loginForm" data-validate>
          <div style="margin-bottom: 1.5rem;">
            <label for="email" style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Identifiant *</label>
            <input type="email" id="email" name="email" required placeholder="admin@gcu-benin.org" style="width: 100%; padding: 0.75rem; border: 1px solid var(--gray-300); border-radius: var(--border-radius-md);">
          </div>
          
          <div style="margin-bottom: 2rem;">
            <label for="password" style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Mot de passe *</label>
            <input type="password" id="password" name="password" required placeholder="••••••••" style="width: 100%; padding: 0.75rem; border: 1px solid var(--gray-300); border-radius: var(--border-radius-md);">
          </div>
          
          <button type="submit" class="btn btn-primary" style="width: 100%;">
            Se connecter
          </button>
        </form>
        
        <div style="text-align: center; margin-top: 1.5rem;">
          <a href="forgot-password.html" style="color: var(--gray-600); font-size: 0.85rem; display: block; margin-bottom: 1rem;">Mot de passe oublié ?</a>
          <a href="../index.html" class="btn btn-secondary" style="width: 100%;">← Retour au site</a>
        </div>
      </div>
    </div>
  </main>
  
  <script src="../js/config.js"></script>
  <script src="../js/main.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      if (!email || !password) {
        alert('Veuillez remplir tous les champs.');
        return;
      }
      
      // Redirection simulée vers le dashboard (à connecter à une vraie API)
      alert('Connexion réussie ! Redirection vers le tableau de bord...');
      window.location.href = 'dashboard.html';
    });
  </script>
</body>
</html>
