<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adhésion — GCU-BÉNIN</title>
<meta name="description" content="Faites votre demande d'adhésion à GCU-BÉNIN et suivez son statut en ligne.">
<meta name="theme-color" content="#0b1f3a">
<meta property="og:type" content="website">
<meta property="og:title" content="Adhésion — GCU-BÉNIN">
<meta property="og:description" content="Faites votre demande d'adhésion à GCU-BÉNIN et suivez son statut en ligne.">
<meta property="og:image" content="assets/images/og-image.jpg">
<meta name="robots" content="index, follow">
<link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>
<main id="main">
<section class="page-hero blueprint"><div class="container"><nav class="breadcrumb" aria-label="Fil d'Ariane"><a href="index.html">Accueil</a> / Adhésion</nav><h1>Rejoindre GCU-BÉNIN</h1><p>Remplissez le formulaire, suivez votre demande, puis accédez à votre espace membre.</p></div></section>
<section class="section"><div class="container" style="max-width:860px">
  <div class="tabs" role="tablist"><button class="tab active" data-t="form" type="button">Demande d'adhésion</button><button class="tab" data-t="track" type="button">Suivre ma demande</button></div>

  <div id="pane-form">
    <div class="form-card">
      <form class="form" id="adh-form" novalidate>
        <div class="form-row">
          <div class="field"><label for="f-last">Nom <span class="req">*</span></label><input id="f-last" name="last_name" required maxlength="100" autocomplete="family-name"></div>
          <div class="field"><label for="f-first">Prénom <span class="req">*</span></label><input id="f-first" name="first_name" required maxlength="100" autocomplete="given-name"></div>
        </div>
        <div class="form-row">
          <div class="field"><label for="f-email">Adresse e-mail <span class="req">*</span></label><input id="f-email" name="email" type="email" required maxlength="200" autocomplete="email"><span class="hint">Utilisez la même adresse pour créer votre compte après acceptation.</span></div>
          <div class="field"><label for="f-phone">Téléphone (facultatif)</label><input id="f-phone" name="phone" type="tel" maxlength="40" autocomplete="tel" placeholder="+229 …"></div>
        </div>
        <div class="form-row">
          <div class="field"><label for="f-commune">Commune</label><input id="f-commune" name="commune" list="communes" maxlength="100" autocomplete="off"><datalist id="communes"></datalist></div>
          <div class="field"><label for="f-level">Niveau d'études ou profession</label><select id="f-level" name="level"><option value="">Choisir…</option></select></div>
        </div>
        <div class="form-row">
          <div class="field"><label for="f-inst">Établissement ou structure (si pertinent)</label><input id="f-inst" name="institution" maxlength="200"></div>
          <div class="field"><label for="f-int">Domaine d'intérêt</label><input id="f-int" name="interest" maxlength="200" placeholder="Ex. béton armé, topographie, routes…"></div>
        </div>
        <div class="field"><label for="f-mot">Motivation</label><textarea id="f-mot" name="motivation" maxlength="2000" placeholder="Pourquoi souhaitez-vous rejoindre GCU-BÉNIN ?"></textarea></div>
        <input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
        <label class="check"><input type="checkbox" name="rules" required> <span>J'ai pris connaissance des <a href="reglement-interieur.html" target="_blank">règles de la communauté</a> et je m'engage à les respecter. <span class="req" style="color:var(--red)">*</span></span></label>
        <label class="check"><input type="checkbox" name="consent" required> <span>J'accepte que mes données personnelles soient traitées pour examiner ma demande, selon la <a href="confidentialite.html" target="_blank">politique de confidentialité</a>. <span class="req" style="color:var(--red)">*</span></span></label>
        <div id="adh-msg" role="alert"></div>
        <button class="btn btn-primary" type="submit" id="adh-btn">Envoyer ma demande</button>
        <p class="hint">Seules les informations utiles à l'examen de votre demande sont collectées.</p>
      </form>
    </div>
  </div>

  <div id="pane-track" class="hidden">
    <div class="form-card">
      <h2 style="font-size:1.8rem">Suivre ma demande</h2>
      <form class="form" id="trk-form" novalidate>
        <div class="form-row">
          <div class="field"><label for="t-code">Code de suivi</label><input id="t-code" required placeholder="ADH-XXXXXXXX" maxlength="20" autocomplete="off"></div>
          <div class="field"><label for="t-email">Adresse e-mail utilisée</label><input id="t-email" type="email" required autocomplete="email"></div>
        </div>
        <div id="trk-msg" role="status"></div>
        <button class="btn btn-dark" type="submit">Consulter le statut</button>
      </form>
    </div>
  </div>
</div></section>
</main>
<div id="site-footer"></div>
<script type="module" src="js/init.js"></script>
<script type="module" src="js/adhesion.js"></script>

</body>
</html>
