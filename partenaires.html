<body>
<div id="site-header"></div>
<main id="main">
<section class="page-hero blueprint"><div class="container"><nav class="breadcrumb" aria-label="Fil d'Ariane"><a href="index.html">Accueil</a> / Partenaires</nav><h1>Partenaires</h1><p>Ceux qui soutiennent officiellement les activités de GCU-BÉNIN.</p></div></section>
<section class="section"><div class="container"><div class="grid grid-3" id="p-list"><div class="loader"><i></i></div></div></div></section>
<section class="section section-alt" id="proposer"><div class="container" style="max-width:820px">
  <div class="section-head center"><span class="eyebrow">Devenir partenaire</span><h2>Proposer un partenariat</h2><p class="lead">Une organisation, un établissement, un professionnel ? Écrivez-nous.</p></div>
  <div class="form-card"><form class="form" id="p-form" novalidate>
    <div class="form-row"><div class="field"><label for="p-org">Organisation <span class="req">*</span></label><input id="p-org" required maxlength="200"></div><div class="field"><label for="p-name">Nom du contact <span class="req">*</span></label><input id="p-name" required maxlength="150"></div></div>
    <div class="form-row"><div class="field"><label for="p-email">E-mail <span class="req">*</span></label><input id="p-email" type="email" required maxlength="200"></div><div class="field"><label for="p-phone">Téléphone</label><input id="p-phone" type="tel" maxlength="40"></div></div>
    <div class="field"><label for="p-msg">Votre proposition</label><textarea id="p-msg" maxlength="3000"></textarea></div>
    <input class="hp" id="p-hp" tabindex="-1" autocomplete="off" aria-hidden="true">
    <div id="p-out" role="alert"></div><button class="btn btn-primary" type="submit">Envoyer la proposition</button></form></div>
</div></section>
</main>
<div id="site-footer"></div>
