<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contactez GCU-BÉNIN. Formulaire de contact et coordonnées.">
  <meta name="theme-color" content="#1E40AF">
  <title>Contact — GÉNIE CIVIL UNIS — BÉNIN</title>
  
  <link rel="icon" type="image/png" href="assets/images/logo.png">
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact">
  <div id="site-header"></div>
  
  <main id="main">
    <!-- Hero -->
    <section class="hero-sub" style="background: linear-gradient(rgba(30, 64, 175, 0.9), rgba(30, 64, 175, 0.8)), url('../assets/images/bg-hero.jpg'); background-size: cover; background-position: center; color: white; padding: 6rem 0;">
      <div class="container" style="text-align: center;">
        <h1 data-animate>Contactez-nous</h1>
        <p class="hero-slogan" data-animate data-delay="1" style="font-style: italic; opacity: 0.9; max-width: 700px; margin-inline: auto;">
          Nous sommes là pour répondre à vos questions.
        </p>
      </div>
    </section>

    <!-- Contact -->
    <section class="section">
      <div class="container">
        <div class="grid" style="grid-template-columns: 1fr 1fr; gap: 3rem;">
          <!-- Infos de contact -->
          <div data-animate>
            <div class="card" style="background: white; border-radius: var(--border-radius-xl); padding: 2rem; box-shadow: var(--shadow-lg); margin-bottom: 2rem;">
              <h2 style="color: var(--primary); margin-bottom: 1.5rem;">Coordonnées</h2>
              
              <div style="display: flex; gap: 1rem; margin-bottom: 1.25rem; align-items: flex-start;">
                <div style="width: 24px; height: 24px; flex-shrink: 0; margin-top: 2px;">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                </div>
                <div>
                  <h3 style="font-weight: 600; margin-bottom: 0.25rem;">Email</h3>
                  <p style="color: var(--gray-600);">contact@gcu-bénin.org</p>
                </div>
              </div>
              
              <div style="display: flex; gap: 1rem; margin-bottom: 1.25rem; align-items: flex-start;">
                <div style="width: 24px; height: 24px; flex-shrink: 0; margin-top: 2px;">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l2.5-2.5a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                </div>
                <div>
                  <h3 style="font-weight: 600; margin-bottom: 0.25rem;">Téléphone</h3>
                  <p style="color: var(--gray-600);">+229 XX XX XX XX XX</p>
                </div>
              </div>
              
              <div style="display: flex; gap: 1rem; align-items: flex-start;">
                <div style="width: 24px; height: 24px; flex-shrink: 0; margin-top: 2px;">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2"><path d="M21 10c0 6-9 13-9 13s-9-7-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle>
                </div>
                <div>
                  <h3 style="font-weight: 600; margin-bottom: 0.25rem;">Adresse</h3>
                  <p style="color: var(--gray-600);">Cotonou, Bénin</p>
                </div>
              </div>
            </div>
            
            <!-- Réseaux sociaux -->
            <div class="card" style="background: white; border-radius: var(--border-radius-xl); padding: 1.5rem; box-shadow: var(--shadow-lg);">
              <h3 style="color: var(--primary); margin-bottom: 1rem;">Réseaux sociaux</h3>
              <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
                <a href="#" style="width: 40px; height: 40px; background: var(--primary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: all 0.2s;">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M18 2H6a4 4 0 0 0-4 4v12a4 4 0 0 0 4 4h12a4 4 0 0 0 4-4V6a4 4 0 0 0-4-4zm0 16H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2z"></path></svg>
                </a>
                <a href="#" style="width: 40px; height: 40px; background: var(--primary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: all 0.2s;">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10v10c-5-.5-9-4.8-9-10s4-9.5 9-10z"></circle></svg>
                </a>
                <a href="#" style="width: 40px; height: 40px; background: var(--primary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: all 0.2s;">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M9 19c-4.3 0-8-3.6-8-8s3.7-7.9 8-7.9 8 3.6 8 7.9 3.7 8 8-7.9S18.7 1 12 1 4 6.1 4 12s3.7 8 8 8z"></path></svg>
                </a>
              </div>
            </div>
          </div>
          
          <!-- Formulaire -->
          <div data-animate data-delay="1">
            <div class="card" style="background: white; border-radius: var(--border-radius-xl); padding: 2rem; box-shadow: var(--shadow-xl);">
              <h2 style="color: var(--primary); margin-bottom: 1.5rem;">Envoyez-nous un message</h2>
              
              <form id="contactForm" data-validate style="display: grid; gap: 1.5rem;">
                <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem;">
                  <div>
                    <label for="nom" style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Nom *</label>
                    <input type="text" id="nom" name="nom" required style="width: 100%; padding: 0.75rem; border: 1px solid var(--gray-300); border-radius: var(--border-radius-md);">
                  </div>
                  <div>
                    <label for="prenom" style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Prénom *</label>
                    <input type="text" id="prenom" name="prenom" required style="width: 100%; padding: 0.75rem; border: 1px solid var(--gray-300); border-radius: var(--border-radius-md);">
                  </div>
                </div>
                
                <div>
                  <label for="email" style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Email *</label>
                  <input type="email" id="email" name="email" required style="width: 100%; padding: 0.75rem; border: 1px solid var(--gray-300); border-radius: var(--border-radius-md);">
                </div>
                
                <div>
                  <label for="objet" style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Objet *</label>
                  <select id="objet" name="objet" required style="width: 100%; padding: 0.75rem; border: 1px solid var(--gray-300); border-radius: var(--border-radius-md);">
                    <option value="">Sélectionner un objet</option>
                    <option>Question générale</option>
                    <option>Adhésion</option>
                    <option>Partenariat</option>
                    <option>Événement</option>
                    <option>Autre</option>
                  </select>
                </div>
                
                <div>
                  <label for="message" style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Message *</label>
                  <textarea id="message" name="message" required rows="5" placeholder="Votre message..." style="width: 100%; padding: 0.75rem; border: 1px solid var(--gray-300); border-radius: var(--border-radius-md); resize: vertical;"></textarea>
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%;">Envoyer le message</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  
  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
