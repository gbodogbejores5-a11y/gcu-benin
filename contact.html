<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — GCU-BÉNIN</title>
<meta name="description" content="Contactez la Direction nationale de GCU-BÉNIN : formulaire de contact, adresse e-mail officielle et réseaux sociaux.">
<meta name="theme-color" content="#0b1f3a">
<meta property="og:type" content="website">
<meta property="og:title" content="Contact — GCU-BÉNIN">
<meta property="og:description" content="Contactez la Direction nationale de GCU-BÉNIN : formulaire de contact, adresse e-mail officielle et réseaux sociaux.">
<meta property="og:image" content="assets/images/og-image.jpg">
<meta name="robots" content="index, follow">
<link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>
<main id="main">
<section class="page-hero blueprint"><div class="container"><nav class="breadcrumb" aria-label="Fil d'Ariane"><a href="index.html">Accueil</a> / Contact</nav><h1>Contact</h1><p>Écrivez à la Direction nationale de GCU-BÉNIN.</p></div></section>
<section class="section"><div class="container split" style="align-items:start">
  <div class="form-card"><form class="form" id="c-form" novalidate>
    <div class="form-row"><div class="field"><label for="c-name">Nom et prénom <span class="req">*</span></label><input id="c-name" required maxlength="150" autocomplete="name"></div><div class="field"><label for="c-email">Adresse e-mail <span class="req">*</span></label><input id="c-email" type="email" required maxlength="200" autocomplete="email"></div></div>
    <div class="form-row"><div class="field"><label for="c-subject">Objet <span class="req">*</span></label><input id="c-subject" required maxlength="200"></div><div class="field"><label for="c-cat">Catégorie de demande</label><select id="c-cat"></select></div></div>
    <div class="field"><label for="c-body">Message <span class="req">*</span></label><textarea id="c-body" required maxlength="5000"></textarea></div>
    <input class="hp" id="c-hp" tabindex="-1" autocomplete="off" aria-hidden="true">
    <label class="check"><input type="checkbox" id="c-consent" required> <span>J'accepte que mes données soient utilisées pour traiter ma demande (<a href="confidentialite.html" target="_blank">confidentialité</a>).</span></label>
    <div id="c-out" role="alert"></div><button class="btn btn-primary" type="submit" id="c-btn">Envoyer le message</button></form></div>
  <aside><h2 style="font-size:1.8rem">Coordonnées officielles</h2><ul class="list-clean" id="c-info"><li><span class="muted">Chargement…</span></li></ul>
    <div class="socials mt-2" id="c-socials" style="--x:0"></div>
    <div class="alert alert-info mt-2"><span></span><div>Les messages sont enregistrés de façon sécurisée et transmis uniquement aux responsables autorisés.</div></div></aside>
</div></section>
</main>
<div id="site-footer"></div>
<script type="module" src="js/init.js"></script>
<script type="module" src="js/contact.js"></script>

</body>
</html>
